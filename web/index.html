<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171e21">
    <title>源石电路修复 · 终末地拼图练习</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23f5cc46'/%3E%3Cpath d='M10 8h20v24H10zM15 15h10v10H15z' fill='none' stroke='%23232a2d' stroke-width='3'/%3E%3C/svg%3E">
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background-color: #0e1315;
        background-image: linear-gradient(#27303544 1px, transparent 1px), linear-gradient(90deg, #27303544 1px, transparent 1px);
        background-size: 48px 48px;
        font-family: "Microsoft YaHei", sans-serif;
      }
      .shell {
        position: relative;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        box-shadow: 0 30px 100px #00000080, 0 0 0 1px #465055;
        background: #171e21;
      }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      canvas:focus-visible { outline: 2px solid #f5cc46; outline-offset: -3px; }
      .accessible {
        position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; padding: 0;
        overflow: hidden; clip-path: inset(50%); white-space: nowrap;
      }
      .rotate-device {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-content: center;
        justify-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        color: #edf3fa;
        background: radial-gradient(ellipse at center, #233348, #101823 75%);
      }
      .rotate-device svg { width: 100px; height: 100px; color: #d9f777; }
      .rotate-device h2 { margin: 0; font-size: 25px; }
      .rotate-device p { margin: 0; font-size: 15px; line-height: 1.8; color: #a9bbd0; }
      @media (orientation: portrait) and (any-pointer: coarse) {
        .shell { visibility: hidden; }
        .rotate-device { display: grid; }
      }
      @media (max-width: 600px), (max-height: 650px) {
        .shell { width: 100%; height: 100dvh; aspect-ratio: auto; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1 class="accessible">源石电路修复：终末地同人拼图练习</h1>
      <p id="instructions" class="accessible">拖动模块自由跟手，松手才对齐格子。错误摆放允许保留并标红。鼠标按住时可按 R 或右键旋转；触屏拖动时另一根手指点旋转。实心方条是当前数量，空心方条是待补齐目标，也可切换数字显示。所有颜色的行列均需匹配。重置可让全部模块归位。</p>
      <canvas id="game" tabindex="0" role="application" aria-label="源石电路修复拼图" aria-describedby="instructions status">此游戏需要浏览器支持 Canvas。</canvas>
      <p id="status" class="accessible" aria-live="polite"></p>
    </main>
    <section class="rotate-device" role="status" aria-labelledby="rotate-title">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <rect x="17" y="30" width="66" height="40" rx="7" stroke="currentColor" stroke-width="3" />
        <path d="M24 43v14M76 43v14M32 19c14-12 35-9 45 5m-1-12 2 13-13-2M68 81c-14 12-35 9-45-5m1 12-2-13 13 2" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h2 id="rotate-title">横屏开始修复</h2>
      <p>请将设备横向放置<br>游戏已暂停，横屏后自动继续</p>
    </section>
    <script src="./game/src/puzzle.js"></script>
    <script src="./game/src/game-app.js"></script>
    <script src="./web/platform-browser.js"></script>
  </body>
</html>
